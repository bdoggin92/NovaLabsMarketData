services:
  autopilot:
    build: .
    ports:
      - '127.0.0.1:18789:18789'
    env_file:
      - .env
    environment:
      AUTOPILOT_STATE_DIR: /data
      AUTOPILOT_WORKSPACE: /data/workspace
      AUTOPILOT_CONFIG_PATH: /data/autopilot.json
    volumes:
      - autopilot_data:/data
    restart: unless-stopped

volumes:
  autopilot_data:
